[project]
name = "owlcompare"
dynamic = ["version"]
description = "Modern semantic ontology diff tool — compare two OWL/RDF ontologies and surface meaningful changes."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Olatunji Felix Ajala (Phelz)", email = "ajala111@yahoo.com" },
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "rdflib>=7.6.0",
    "rich>=15.0.0",
    "typer>=0.26.2,<0.27",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Repository = "https://github.com/Phelz/owlcompare"

[project.scripts]
owlcompare = "owlcompare.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "respx>=0.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/owlcompare/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/owlcompare"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
