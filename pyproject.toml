[project]
name = "owlcompare"
dynamic = ["version"]
description = "Modern semantic ontology diff tool — compare two OWL/RDF ontologies and surface meaningful changes."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Olatunji Felix Ajala (Phelz)", email = "ajala111@yahoo.com" },
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "rdflib>=7.6.0",
    "rich>=15.0.0",
    "typer>=0.26.2,<0.27",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Repository = "https://github.com/Ajala111/owlcompare"

[project.scripts]
owlcompare = "owlcompare.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.14,<0.16",  # DD-017: cap the major line; 0.15.x has an f-string format panic we route around
    "mypy>=1.11",
    "respx>=0.23.1",
    "jsonschema>=4.26.0",  # DD-020: test-only schema validation; not a runtime dependency
    "pyyaml>=6.0",
]

# Component 20: the documentation site. Optional group — a plain `uv sync` does
# NOT pull these in; build the site with `uv sync --group docs`. The docs CI
# workflow installs only this group via `uv sync --only-group docs`.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/owlcompare/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/owlcompare"]

# Ship the canonical JSON Schema (Component 14) as package data so a `pip install
# owlcompare` carries the contract and `owlcompare.schema.load_schema()` can read
# it via importlib.resources. The single source file lives in docs/schema/; this
# maps it under the package in the wheel. See DD-019 / DD-020.
[tool.hatch.build.targets.wheel.force-include]
"docs/schema/diff-result.schema.json" = "owlcompare/schema/diff-result.schema.json"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Several acceptance-test names mirror OWL constructs verbatim from the specs
# (e.g. someValuesFrom, allValuesFrom, hasValue, AllDisjointClasses), so the test
# function names carry mixedCase fragments. Allow N802 in tests only.
"tests/**" = ["N802"]

[tool.ruff.format]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# jsonschema is a dev-only dependency (DD-020) and ships no type stubs. The
# import is deferred inside owlcompare.schema.validate_diff_json; silence the
# missing-stub error rather than pull in a stubs package for one call site.
[[tool.mypy.overrides]]
module = "jsonschema.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:rdflib.*",
]
